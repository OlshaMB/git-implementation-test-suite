[package]
name = "packtest"
version = "0.1.0"
edition = "2024"
description = "Conformance and interoperability tests for Git pack generators"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
git2 = { version = "0.20", default-features = false }
hex = "0.4"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tempfile = "3.20"
toml = "0.8"
wait-timeout = "0.2"
